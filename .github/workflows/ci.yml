name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.10"
          python-version: "3.10"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff check src tests
      - run: uv run --frozen pytest -q

  smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: food11-api:ci
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=food11-api
          cache-to: type=gha,mode=max,scope=food11-api
      - name: Check startup without a model
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name api -p 127.0.0.1:8000:8000 -e SKIP_MODEL=1 food11-api:ci
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              code=$(curl --silent --output /tmp/predict.json --write-out '%{http_code}' \
                -F file=@tests/fixtures/bread.jpg http://127.0.0.1:8000/predict)
              test "$code" = 503
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Container logs
        if: always()
        run: docker logs api || true
      - name: Remove smoke container
        if: always()
        run: docker rm -f api || true
      - name: Save the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save food11-api:ci -o /tmp/food11-api.tar
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tested-image
          path: /tmp/food11-api.tar
          retention-days: 1

  push:
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-image
          path: /tmp
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact image that passed smoke checks
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker load -i /tmp/food11-api.tar
          docker tag food11-api:ci "$image"
          docker push "$image"
          echo "Published $image" >> "$GITHUB_STEP_SUMMARY"
